  <main class="p-contact l-main">
    <!-- sub-fv -->
    <section class="p-contact-fv c-sub-fv">
      <div class="p-contact-fv__img c-sub-fv__img">
        <picture>
          <source srcset="./images/contact/contact-fv-image.jpg" media="(min-width:768px)">
          <img src="./images/contact/contact-fv-image-sp.jpg" alt="テーブルに置かれたノートパソコン、楽譜、マイクとヘッドホン">
        </picture>
      </div>
      <div class="p-contact-fv__contents c-sub-fv__contents">
        <h1 class="p-contact-fv__title c-sub-fv__title">お問い合わせ</h1>
      </div>
    </section>
    <div class="c-breadcrumb">
      <div class="l-inner c-breadcrumb__inner">
        <ol class="c-breadcrumb__list">
          <li class="c-breadcrumb__item">
            <a href="./index.html" class="c-breadcrumb__link">ホーム</a>
          </li>
          <li class="c-breadcrumb__item">></li>
          <li class="c-breadcrumb__item current">お問い合わせ</li>
        </ol>
      </div>
    </div>
    <div class="p-contact__container">
      <div class="p-contact__inner l-inner">
        <p class="p-contact__text">当校に関するご質問・ご相談・資料請求は下記のフォームからお気軽にお問い合わせください。<br>通常３営業日以内にメールにてご連絡させていただきます。</p>
        <div class="p-contact-form__container">
          <form action="./contact-send.html" class="p-contact-form p-form">
            <dl class="p-form__list">
              <div class="p-form__field">
                <dt class="p-form__label">
                  <label for="your-company" class="p-form__label-text">会社名</label>
                </dt>
                <dd class="p-form__data">
                  <input type="text" id="your-company" name="your-company" class="p-form__input" placeholder="きたむらミュージックスクール" required>
                </dd>
              </div>
              <div class="p-form__field">
                <dt class="p-form__label">
                  <label for="your-name" class="p-form__label-text">お名前</label>
                </dt>
                <dd class="p-form__data">
                  <input type="text" id="your-name" name="your-name" class="p-form__input" placeholder="北村　翔平" required>
                </dd>
              </div>
              <div class="p-form__field">
                <dt class="p-form__label">
                  <label for="email" class="p-form__label-text">メールアドレス</label>
                </dt>
                <dd class="p-form__data">
                  <input type="email" id="email" name="your-email" class="p-form__input" placeholder="info@kitamura.musicschool.jp" required>
                </dd>
              </div>
              <div class="p-form__field">
                <dt class="p-form__label">
                  <label for="phonenumber" class="p-form__label-text">電話番号</label>
                </dt>
                <dd class="p-form__data">
                  <input type="text" id="phonenumber" name="phone-number" class="p-form__input" placeholder="090-1234-5678" required>
                </dd>
              </div>
              <!-- チェックボックス -->
              <div class="p-form__field p-form__field-checkbox">
                <dt class="p-form__label p-checkbox__label">
                  <label class="p-form__label-text p-checkbox-label__text">目　的<br class="md-none"><span class="p-checkbox-label__text02">(複数選択可)</span></label>
                </dt>
                <dd class="p-form__data p-form-data__checkbox">
                  <label class="p-checkbox-item">
                    <input type="checkbox" name="source[]" value="プランについてのお問い合わせ"><span class="p-checkbox-item__name">プランについてのお問い合わせ</span>
                  </label>
                  <label class="p-checkbox-item">
                    <input type="checkbox" name="source[]" value="ヒアリングのご予約"><span class="p-checkbox-item__name">ヒアリングのご予約</span>
                  </label>
                  <label class="p-checkbox-item">
                    <input type="checkbox" name="source[]" value="資料請求"><span class="p-checkbox-item__name">資料請求</span>
                  </label>
                  <label class="p-checkbox-item">
                    <input type="checkbox" name="source[]" value="その他"><span class="p-checkbox-item__name">その他</span>
                  </label>
                </dd>
              </div>
              <div class="p-form__field p-form__field-textarea">
                <dt class="p-form__label p-textarea__label">
                  <label for="message" class="p-form__label-text">内　容</label>
                </dt>
                <dd class="p-form__data">
                  <textarea id="message" name="message" class="p-form__input p-form__textarea" placeholder="内容に関する詳細や備考等をご入力ください。" required></textarea>
                </dd>
              </div>
            </dl>
            <div class="p-form-submit__button">
              <input class="p-form-submit__input c-button" type="submit" value="送 信">
            </div>
          </form>
        </div>
      </div>
